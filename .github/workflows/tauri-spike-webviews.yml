# Closes the stage-1 gate of the Tauri migration spike on the two platforms a
# headless Linux VM can never check.
#
# Tauri uses the system webview, so "cross-platform" means three rendering
# engines, not one: WebKitGTK on Linux, WKWebView on macOS, WebView2 on
# Windows. Only WebKitGTK had ever been run. This job answers the same
# question on all three.
#
# The check is not a screenshot. The spike runs in smoke mode and the bridge
# host waits for three signals, each of which can only happen if the one
# before it did:
#
#   1. the interface reached the bridge      -> page loaded, bundle ran, React mounted
#   2. the interface resolved its backend    -> it found openwork-server
#   3. remote-origin IPC into Rust           -> Tauri's ACL grant works here
#
# All three seen: exit 0. Timeout: exit 1, naming what never arrived.
#
# Manual and path-scoped on purpose — this builds Rust on three runners, and
# nothing outside the spike can change its result.
name: Tauri spike · webviews

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop-tauri/**"
      - ".github/workflows/tauri-spike-webviews.yml"

permissions:
  contents: read

jobs:
  webview:
    name: ${{ matrix.webview }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            webview: WebKitGTK (Linux)
          - os: macos-14
            webview: WKWebView (macOS)
          - os: windows-latest
            webview: WebView2 (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      # WebKitGTK and its dev headers are not on the Ubuntu runner, and Xvfb is
      # the only display it has. macOS and Windows ship their webview already.
      - name: Install Linux webview and display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bridge makes the app a desktop runtime, so this is the ordinary
      # desktop build — not the web build stage 2 needed.
      - name: Build the interface
        run: pnpm --filter @openwork/app build

      - name: Build the spike
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo build --release

      - name: Run the webview check
        working-directory: apps/desktop-tauri
        shell: bash
        env:
          RANTAI_SPIKE_SMOKE: "1"
          RANTAI_SPIKE_SMOKE_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          binary=src-tauri/target/release/rantai-tauri-spike
          if [ "${RUNNER_OS}" = "Windows" ]; then
            binary="${binary}.exe"
          fi

          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a "${binary}"
          else
            "${binary}"
          fi

      # The report names which signals arrived, so a failure says what broke
      # rather than only that something did.
      - name: Report
        if: always()
        shell: bash
        run: |
          report="${HOME}/.openwork-tauri-spike/smoke.json"
          if [ -f "${report}" ]; then
            echo '### ${{ matrix.webview }}' >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '### ${{ matrix.webview }} — the spike never wrote a report' >> "${GITHUB_STEP_SUMMARY}"
          fi
